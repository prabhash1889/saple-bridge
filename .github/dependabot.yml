# Dependency and advisory scanning.
#
# Weekly update PRs for every lockfile in the repo, plus the github-actions ecosystem so
# pinned action SHAs (.github/workflows/*) get bump PRs when new releases land.
# When merging an actions bump, re-resolve the new tag's full commit SHA before pinning.
#
# Advisory scanning: Dependabot alerts (repo Settings > Code security) cover npm + cargo
# continuously; .github/workflows/ci.yml `audit` additionally fails CI on known production
# advisories (`npm audit --omit=dev`, `cargo audit`).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-dev:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      npm-prod:
        dependency-type: "production"
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      e2e-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "keyring"
        update-types: ["version-update:semver-major"]
      - dependency-name: "ureq"
        update-types: ["version-update:semver-major"]
      - dependency-name: "windows-sys"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
