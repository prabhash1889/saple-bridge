# Dependency and advisory scanning.
#
# Weekly update PRs for every lockfile in the repo, plus the github-actions ecosystem so
# pinned action SHAs (.github/workflows/*) get bump PRs when new releases land.
# When merging an actions bump, re-resolve the new tag's full commit SHA before pinning.
#
# Advisory scanning: Dependabot alerts (repo Settings > Code security) cover npm + cargo
# continuously; .github/workflows/ci.yml `audit` additionally fails CI on known production
# advisories (`npm audit --omit=dev`, `cargo audit`).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
