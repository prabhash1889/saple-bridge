name: Release

# Cut a release by pushing a version tag (see `npm run release`, which bumps + tags + pushes):
#   git tag v1.1.0 && git push --follow-tags
# This builds the signed, updater-ready Windows, macOS (Apple Silicon), and Linux bundles and
# publishes a DRAFT GitHub release with `latest.json`. All matrix legs upload into the same draft; tauri-action
# merges each platform's entry into `latest.json` rather than overwriting. Installed apps only see
# the update once you review and publish that draft.
on:
  push:
    tags:
      - 'v*'

# The release job needs to create the GitHub release and upload the installer + latest.json.
# id-token is required by attest-build-provenance for keyless Sigstore signing of the
# build-provenance attestations uploaded alongside the installers.
permissions:
  contents: write
  id-token: write

# One release at a time, never cancelled: two tags pushed close together queue instead of racing
# for the same draft release / latest.json.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    # The `release` GitHub environment carries the manual approval gate (required reviewers).
    # Environments are configured repo-side (Settings > Environments); see docs/RELEASE_ENVIRONMENT.md.
    environment: release
    # fail-fast: false so one platform failure never cancels the other release legs.
    # macos-latest is Apple Silicon (arm64); Intel Macs would need a separate x86_64 / universal
    # build. macOS artifacts are updater-signed (minisign) but NOT Apple-notarized yet, so Gatekeeper
    # will warn on first open until an Apple Developer cert is wired in.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      # Two sibling checkouts: prepare-sidecar.mjs builds ../saple-mcp relative to the bridge root,
      # so the layout on disk must be <workspace>/saple-bridge and <workspace>/saple-mcp.
      # Third-party actions are pinned to full commit SHAs (supply-chain hardening); the version
      # comment records which release the SHA resolves to. Update via Dependabot's
      # github-actions ecosystem PRs, then re-resolve the SHA from the new tag.
      - name: Checkout saple-bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: saple-bridge

      - name: Checkout saple-mcp (sidecar source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: prabhash1889/saple-mcp
          path: saple-mcp
          # Pin to the same reviewed commit as scripts/prepare-sidecar.mjs verifies locally
          # (SAPLE_MCP_SHA repository variable). Falls back to main only while unpinned; the
          # sidecar pin check in prepare-sidecar.mjs fails CI in that case.
          ref: ${{ vars.SAPLE_MCP_SHA || 'main' }}
          # saple-mcp is a separate repo; the default GITHUB_TOKEN can't read it. Provide a PAT
          # (repo scope) or deploy key as the SAPLE_MCP_TOKEN secret. Drop this line if it's public.
          token: ${{ secrets.SAPLE_MCP_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19
          cache: npm
          cache-dependency-path: saple-bridge/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: saple-bridge/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install dependencies
        run: npm ci
        working-directory: saple-bridge

      # tauri-action runs `tauri build` (which runs beforeBuildCommand: stage the real sidecar +
      # build the frontend), signs the updater artifacts, uploads the installer, and generates
      # latest.json. The release overlay adds createUpdaterArtifacts + the updater feed so the base
      # config (and local `npm run tauri:build`) stays signing-free.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: saple-bridge
          tagName: ${{ github.ref_name }}
          releaseName: 'Saple Bridge ${{ github.ref_name }}'
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json

      # Post-build verification chain for everything this leg produced:
      #   1. pull the leg's installers back down from the draft release (what users get, not
      #      what was on disk at build time - proves the uploaded bytes are the shipped bytes)
      #   2. publish a per-platform SHA256SUMS file as a release asset
      #   3. generate a SLSA build-provenance attestation (keyless Sigstore) and upload it
      #
      # Filenames are platform-suffixed because all three legs upload into the same draft.
      - name: Collect built artifacts from draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          case "${{ matrix.os }}" in
            windows-*) sums=windows; exts='exe|msi|zip' ;;
            macos-*)   sums=macos;   exts='dmg|tar.gz|sig' ;;
            ubuntu-*)  sums=linux;   exts='deb|rpm|AppImage' ;;
          esac
          # Download every draft asset once, then filter locally instead of passing
          # per-platform globs to gh: a glob that matches nothing aborts the step and
          # would red-X a finished build over a renamed artifact.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir downloaded --clobber
          mkdir -p artifacts
          found=0
          for f in downloaded/*; do
            base=$(basename "$f")
            if [[ "$base" =~ \.(${exts})$ ]]; then
              cp "$f" artifacts/
              found=1
            fi
          done
          if [[ "$found" -ne 1 ]]; then
            echo "::error::No ${sums} artifacts found in draft release $tag"
            ls downloaded
            exit 1
          fi
          (cd artifacts && sha256sum -- *) > "SHA256SUMS-$sums.txt"
          cat "SHA256SUMS-$sums.txt"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Upload checksums and provenance to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Rename the attestation bundle per-platform: all legs upload into one draft
          # release, and identical asset names would silently clobber each other.
          platform=$(echo "${{ runner.os }}" | tr '[:upper:]' '[:lower:]')
          bundle="build-provenance-${platform}.intoto.jsonl"
          cp "${{ steps.attest.outputs.bundle-path }}" "$bundle"
          gh release upload "${{ github.ref_name }}" SHA256SUMS-*.txt "$bundle" \
            --clobber --repo "$GITHUB_REPOSITORY"
