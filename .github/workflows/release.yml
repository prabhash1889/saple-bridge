name: Release

# Cut a release by pushing a version tag (see `npm run release`, which bumps + tags + pushes):
#   git tag v1.1.0 && git push --follow-tags
# This builds the signed, updater-ready Windows, macOS (Apple Silicon), and Linux bundles and
# publishes a DRAFT GitHub release with `latest.json`. All matrix legs upload into the same draft; tauri-action
# merges each platform's entry into `latest.json` rather than overwriting. Installed apps only see
# the update once you review and publish that draft.
on:
  push:
    tags:
      - 'v*'

# The release job needs to create the GitHub release and upload the installer + latest.json.
permissions:
  contents: write

# One release at a time, never cancelled: two tags pushed close together queue instead of racing
# for the same draft release / latest.json.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    # The `release` GitHub environment carries the manual approval gate (required reviewers).
    # Environments are configured repo-side (Settings > Environments); see docs/RELEASE_ENVIRONMENT.md.
    environment: release
    # fail-fast: false so one platform failure never cancels the other release legs.
    # macos-latest is Apple Silicon (arm64); Intel Macs would need a separate x86_64 / universal
    # build. macOS artifacts are updater-signed (minisign) but NOT Apple-notarized yet, so Gatekeeper
    # will warn on first open until an Apple Developer cert is wired in.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      # Two sibling checkouts: prepare-sidecar.mjs builds ../saple-mcp relative to the bridge root,
      # so the layout on disk must be <workspace>/saple-bridge and <workspace>/saple-mcp.
      # Third-party actions are pinned to full commit SHAs (supply-chain hardening); the version
      # comment records which release the SHA resolves to. Update via Dependabot's
      # github-actions ecosystem PRs, then re-resolve the SHA from the new tag.
      - name: Checkout saple-bridge
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: saple-bridge

      - name: Checkout saple-mcp (sidecar source)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: prabhash1889/saple-mcp
          path: saple-mcp
          # Pin to the same reviewed commit as scripts/prepare-sidecar.mjs verifies locally
          # (SAPLE_MCP_SHA repository variable). Falls back to main only while unpinned; the
          # sidecar pin check in prepare-sidecar.mjs fails CI in that case.
          ref: ${{ vars.SAPLE_MCP_SHA || 'main' }}
          # saple-mcp is a separate repo; the default GITHUB_TOKEN can't read it. Provide a PAT
          # (repo scope) or deploy key as the SAPLE_MCP_TOKEN secret. Drop this line if it's public.
          token: ${{ secrets.SAPLE_MCP_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: saple-bridge/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: saple-bridge/src-tauri

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev

      - name: Install dependencies
        run: npm ci
        working-directory: saple-bridge

      # tauri-action runs `tauri build` (which runs beforeBuildCommand: stage the real sidecar +
      # build the frontend), signs the updater artifacts, uploads the installer, and generates
      # latest.json. The release overlay adds createUpdaterArtifacts + the updater feed so the base
      # config (and local `npm run tauri:build`) stays signing-free.
      - name: Build and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: saple-bridge
          tagName: ${{ github.ref_name }}
          releaseName: 'Saple Bridge ${{ github.ref_name }}'
          releaseDraft: true
          args: --config src-tauri/tauri.release.conf.json
