name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (supply-chain hardening); the version
# comment records which release the SHA resolves to. Dependabot's github-actions ecosystem
# opens PRs when new releases land - re-resolve the SHA from the tag when merging those.

jobs:
  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    # macOS 11+ is a shipped target, so build/test the native layer there too — it exercises the
    # non-Windows PTY cleanup path, the login-shell/$SHELL handling, and other cfg-gated code that
    # the Windows runner never compiles.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          components: clippy
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # Tauri's build.rs checks that the externalBin sidecar file exists, even for a
      # bare `cargo check`/`test` (it's never run or bundled here). The real sidecar is
      # built from the sibling ../saple-mcp repo, which CI doesn't check out, so stage an
      # empty placeholder with the target-triple name to satisfy the existence check.
      # ponytail: placeholder is enough for check/test; real sidecar staging lives in the tauri:build path.
      - name: Stage placeholder sidecar
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          if [[ "$triple" == *windows* ]]; then
            touch "src-tauri/binaries/saple-mcp-$triple.exe"
          else
            touch "src-tauri/binaries/saple-mcp-$triple"
          fi

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: E2E smoke (windows)
    runs-on: windows-latest
    # WebView2/msedgedriver setup is inherently flaky — keep this non-blocking until it has
    # proven stable, so a driver hiccup never red-Xes an otherwise good PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          # This job installs both the root frontend deps and the e2e/ suite.
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          toolchain: stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # dist/ must exist before cargo build — Tauri embeds the frontend at compile time.
      - name: Build frontend
        run: npm run build

      # Same placeholder trick as the rust job: build.rs only checks the sidecar file exists; the
      # smoke test spawns a plain shell, not the MCP sidecar, so an empty stub is enough.
      - name: Stage placeholder sidecar
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          touch "src-tauri/binaries/saple-mcp-$triple.exe"

      - name: Build app binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install E2E deps
        working-directory: e2e
        run: npm ci

      - name: Run smoke test
        working-directory: e2e
        run: npm test

  audit:
    name: Dependency audit (npm + cargo advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      # Production dependency tree only; dev-only advisories don't block CI.
      - name: npm audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch head
        with:
          toolchain: stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      # Fails the job when the Rust Advisory Database reports a vulnerability (incl. high/critical)
      # or an unmaintained/yanked crate marked as a warning-worthy finding.
      - name: cargo audit
        run: cargo audit --file src-tauri/Cargo.lock
